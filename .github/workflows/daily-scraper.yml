name: Daily Airfare Scraper

on:
  schedule:
    # Runs at 1:30 AM UTC every day, which is 7:00 AM IST.
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth
          playwright install chromium

      - name: Run Scraper
        run: |
          cd scraper
          python akasaair.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scraper/data/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Daily scrape $(date +'%Y-%m-%d')"
          git push
